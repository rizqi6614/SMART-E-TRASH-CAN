<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061610"/>
      <stop offset="50%" stop-color="#0c251b"/>
      <stop offset="100%" stop-color="#05120c"/>
    </linearGradient>

    <!-- Neon Green Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b050"/>
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <!-- Bin Body Gradient -->
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14382a"/>
      <stop offset="100%" stop-color="#0b2017"/>
    </linearGradient>

    <!-- Lid Gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border with Glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Background Tech Grid / Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00e676" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.2"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 12" opacity="0.15"/>

  <!-- IoT Signal Waves (Top) -->
  <g filter="url(#neonGlow)" opacity="0.95">
    <!-- Center antenna node -->
    <circle cx="256" cy="118" r="7" fill="#00ff88"/>

    <!-- Wave 1 -->
    <path d="M 226 100 A 38 38 0 0 1 286 100" fill="none" stroke="#00ff88" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Wave 2 -->
    <path d="M 206 80 A 64 64 0 0 1 306 80" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Wave 3 -->
    <path d="M 186 60 A 90 90 0 0 1 326 60" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Smart Bin Body Structure -->
  <g>
    <!-- Handle / Sensor Bar on Top of Lid -->
    <rect x="236" y="142" width="40" height="12" rx="6" fill="#00e676"/>

    <!-- Lid -->
    <path d="M 152 170 C 152 160, 160 154, 172 154 L 340 154 C 352 154, 360 160, 360 170 L 366 182 C 366 186, 362 190, 356 190 L 156 190 C 150 190, 146 186, 146 182 Z" 
          fill="url(#lidGrad)" filter="url(#neonGlow)"/>

    <!-- Bin Main Body (Tapered Bucket) -->
    <path d="M 162 204 L 180 396 C 182 414, 196 426, 214 426 L 298 426 C 316 426, 330 414, 332 396 L 350 204 Z" 
          fill="url(#binGrad)" stroke="#1e4d3a" stroke-width="4"/>

    <!-- Bin Body Accent Lighting Edges -->
    <path d="M 180 396 L 162 204" stroke="#00e676" stroke-width="2.5" opacity="0.6"/>
    <path d="M 332 396 L 350 204" stroke="#00e676" stroke-width="2.5" opacity="0.6"/>
    <path d="M 214 426 L 298 426" stroke="#00e676" stroke-width="2.5" opacity="0.6"/>

    <!-- Vertical Grooves (3 bins representation) -->
    <line x1="222" y1="220" x2="232" y2="390" stroke="#0a1a13" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="220" x2="280" y2="390" stroke="#0a1a13" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing Recycle Logo Center -->
    <g transform="translate(256, 308) scale(1.15)" filter="url(#strongGlow)">
      <!-- Arrow 1 (Top Right to Top Left) -->
      <path d="M 4 -32 L -18 -32 L -12 -38 M -18 -32 L -12 -26" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -18 -32 C -32 -32 -38 -20 -38 -6" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>

      <!-- Arrow 2 (Left to Bottom Right) -->
      <path d="M -36 6 L -25 25 L -17 21 M -25 25 L -29 17" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -25 25 C -18 36 -4 40 10 33" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>

      <!-- Arrow 3 (Bottom to Right Top) -->
      <path d="M 22 25 L 34 -4 L 38 4 M 34 -4 L 28 2" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 34 -4 C 36 -18 28 -30 14 -32" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>

      <!-- Center IoT Energy Dot -->
      <circle cx="0" cy="-2" r="5" fill="#00e5ff"/>
    </g>

    <!-- LED Status Dots at Base of Lid -->
    <circle cx="210" cy="172" r="3.5" fill="#00e676"/>
    <circle cx="256" cy="172" r="3.5" fill="#ffb300"/>
    <circle cx="302" cy="172" r="3.5" fill="#ff5252"/>
  </g>

  <!-- High-Tech Label -->
  <text x="256" y="468" text-anchor="middle" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#00e676" letter-spacing="6">SMART BIN</text>
</svg>
